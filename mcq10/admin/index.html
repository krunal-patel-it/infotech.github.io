<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>MCQ Quiz - Admin Panel</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- PDF Generation Libraries -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <div id="app">

    <!-- Loading -->
    <div id="screen-loading" class="screen active">
      <div class="loading-content">
        <div class="spinner"></div>
        <p>Loading Admin Panel...</p>
      </div>
    </div>

    <!-- Login Screen -->
    <div id="screen-login" class="screen">
      <div class="login-card">
        <div class="logo">A</div>
        <h1>Admin Panel</h1>
        <p class="subtitle">MCQ Quiz Module</p>

        <form id="form-admin-login">
          <div class="form-group">
            <label for="admin-email">Email</label>
            <input type="email" id="admin-email" placeholder="admin@quiz.com" required value="admin@quiz.com" />
          </div>
          <div class="form-group">
            <label for="admin-password">Password</label>
            <input type="password" id="admin-password" placeholder="Enter password" required value="admin123" />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Login as Admin</button>
          <p class="form-message" id="login-message"></p>
        </form>
        <p class="hint">Demo: admin@quiz.com / admin123</p>
      </div>
    </div>

    <!-- Main Admin App -->
    <div id="screen-main" class="screen">
      <div class="main-wrapper">
        <header class="topbar">
          <h2 id="page-title">Dashboard</h2>
          <div class="topbar-right">
            <span id="sheets-status-top"></span>
            <button id="btn-darkmode" class="icon-btn" type="button" aria-label="Toggle dark mode">🌙</button>
            <div class="admin-stack">
              <span class="admin-badge">Admin</span>
              <button id="btn-logout" class="logout-link" type="button">Logout</button>
            </div>
          </div>
        </header>
        <nav class="nav-strip" id="nav-strip" aria-label="Admin sections">
          <button class="nav-btn active" data-view="dashboard" type="button">Dashboard</button>
          <button class="nav-btn" data-view="users" type="button">Manage Users</button>
          <button class="nav-btn" data-view="questions" type="button">Question Bank</button>
          <button class="nav-btn" data-view="reports" type="button">Reports</button>
          <button class="nav-btn" data-view="settings" type="button">Settings</button>
        </nav>
        <main id="main-content" class="main-content"></main>
      </div>
    </div>

    <!-- Modal Container -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal" id="modal">
        <div class="modal-header">
          <h3 id="modal-title">Modal</h3>
          <button id="modal-close" class="icon-btn">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
      </div>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('Admin SW registered', reg.scope);
        }).catch(err => console.warn('SW registration failed', err));
      });
    }
  </script>
</body>
</html>
