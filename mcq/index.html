<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>MCQ Quiz Module</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e3a8a 50%, #1e40af 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 720px;
      text-align: center;
    }
    .logo {
      width: 72px; height: 72px;
      background: white;
      color: var(--primary);
      font-size: 28px; font-weight: 800;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h1 { color: white; font-size: 1.75rem; margin-bottom: 6px; }
    .subtitle { color: rgba(255,255,255,0.75); font-size: 1rem; margin-bottom: 40px; }
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 560px) {
      .cards { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 32px 24px;
      text-decoration: none;
      color: var(--text);
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: block;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    .card .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .card h2 { font-size: 1.25rem; margin-bottom: 8px; color: var(--primary); }
    .card p { font-size: 0.9rem; color: var(--muted); line-height: 1.45; }
    .footer {
      margin-top: 36px;
      color: rgba(255,255,255,0.5);
      font-size: 0.8rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">MCQ</div>
    <h1>MCQ Quiz Module</h1>
    <p class="subtitle">Choose your panel to continue</p>

    <div class="cards">
      <a href="student/index.html" class="card">
        <div class="icon">🎓</div>
        <h2>Student Panel</h2>
        <p>Register, take quizzes, track progress and view results</p>
      </a>
      <a href="admin/index.html" class="card">
        <div class="icon">⚙️</div>
        <h2>Admin Panel</h2>
        <p>Manage users, question bank, reports and settings</p>
      </a>
    </div>

    <p class="footer">
      MVP · Works offline · Data stored in browser<br>
      Admin login: <strong>admin@quiz.com</strong> / <strong>admin123</strong>
    </p>
  </div>
</body>
</html>
